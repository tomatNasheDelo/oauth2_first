server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: oauth2-first-github-demo
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:replace-with-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:replace-with-client-secret}
            scope:
              - read:user
        provider:
          github:
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

app:
  demo:
    base-url: ${APP_BASE_URL:http://localhost:8080}
